name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "cmake;3.31.6" "ndk;29.0.14206865"

      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: citra-android-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
