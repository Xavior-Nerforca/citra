name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "cmake;3.31.6" "ndk;26.3.11579264"

      - name: Patch legacy Boost hash compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("externals/boost/boost/container_hash/hash.hpp")
          source = path.read_text()
          old = """#else
          template <typename T> struct hash_base : std::unary_function<T, std::size_t> {};
          #endif"""
          new = """#else
          template <typename T>
          struct hash_base
          {
              typedef T argument_type;
              typedef std::size_t result_type;
          };
          #endif"""
          if old not in source:
              raise SystemExit("Expected Boost hash_base compatibility block was not found")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Build debug APK
        working-directory: src/android
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: citra-android-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
