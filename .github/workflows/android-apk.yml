name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "cmake;3.31.6" "ndk;26.3.11579264"

      - name: Patch legacy Boost hash compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("externals/boost/boost/container_hash/hash.hpp")
          source = path.read_text()
          target = "struct hash_base : std::unary_function<T, std::size_t> {};"
          if source.count(target) != 1:
              raise SystemExit("Expected exactly one legacy Boost unary_function declaration")

          index = source.index(target)
          line_start = source.rfind("\n", 0, index) + 1
          template_start = source.rfind("\n", 0, line_start - 1) + 1
          line_end = source.find("\n", index)
          if line_end < 0:
              line_end = len(source)

          indent = source[line_start:index]
          previous_line = source[template_start:line_start].strip()
          if previous_line != "template <typename T>":
              raise SystemExit("Unexpected Boost hash_base template declaration")

          replacement = (
              indent + "template <typename T>\n"
              + indent + "struct hash_base\n"
              + indent + "{\n"
              + indent + "    typedef T argument_type;\n"
              + indent + "    typedef std::size_t result_type;\n"
              + indent + "};"
          )
          source = source[:template_start] + replacement + source[line_end:]
          path.write_text(source)

          # Boost.Asio in this submodule still imports std::result_of, which
          # libc++ removes in C++20. Use the supported std::invoke_result path.
          asio_path = Path("externals/boost/boost/asio/detail/type_traits.hpp")
          asio_source = asio_path.read_text()
          config_include = "#include <boost/asio/detail/config.hpp>\n"
          define = (
              "#if defined(BOOST_ASIO_HAS_STD_TYPE_TRAITS) && "
              "!defined(BOOST_ASIO_HAS_STD_INVOKE_RESULT)\n"
              "#define BOOST_ASIO_HAS_STD_INVOKE_RESULT 1\n"
              "#endif\n"
          )
          if define not in asio_source:
              if asio_source.count(config_include) != 1:
                  raise SystemExit("Unexpected Boost.Asio type_traits header")
              asio_source = asio_source.replace(config_include, config_include + define, 1)
              asio_path.write_text(asio_source)
          PY

      - name: Build debug APK
        working-directory: src/android
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: citra-android-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
